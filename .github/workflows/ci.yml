name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Test (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cc: gcc
            cxx: g++
          - compiler: clang
            cc: clang
            cxx: clang++
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: >
          cmake -S . -B build
          -DBUILD_TESTS=ON
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_FLAGS="-Wall -Wextra -Werror"
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure

  sanitizers:
    name: ASan + UBSan + _GLIBCXX_DEBUG
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >
          cmake -S . -B build-asan
          -DBUILD_TESTS=ON
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-Wall -Wextra -D_GLIBCXX_DEBUG -fsanitize=address,undefined -fno-omit-frame-pointer"
      - name: Build
        run: cmake --build build-asan -j
      - name: Test under sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1
        run: ctest --test-dir build-asan --output-on-failure

  smoke:
    name: Smoke test (testBase4.dat)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j
      - name: Source view, paging, search, exit
        run: |
          printf '1\nn\nn\nb\n2\ns\nДем\n\nx\n0\n' | ./build/saod testBase4.dat > out.txt 2>&1
          grep -q "Страница 3/200" out.txt
          grep -q "найдено 876 записей" out.txt
          grep -q "В очереди записей: 876" out.txt
      - name: Sanitized run of the full pipeline
        run: |
          cmake -S . -B build-asan -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="-D_GLIBCXX_DEBUG -fsanitize=address,undefined -fno-omit-frame-pointer"
          cmake --build build-asan -j
          printf '2\ns\nЯно\n\ns\nЫвф\n\nr\n\ni\n5\n\nb\n0\n' | ./build-asan/saod testBase4.dat > out-asan.txt 2>&1
          grep -q "найдено 400 записей" out-asan.txt
          grep -q "Очередь пуста" out-asan.txt

  artifact:
    name: Upload binary
    runs-on: ubuntu-latest
    needs: [build, sanitizers, smoke]
    steps:
      - uses: actions/checkout@v4
      - name: Build release binary
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          && cmake --build build -j
      - uses: actions/upload-artifact@v4
        with:
          name: saod-linux-x64
          path: build/saod
          retention-days: 7

  release:
    name: Release on tag
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build release binary
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          && cmake --build build -j
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          build/saod
          --title "$GITHUB_REF_NAME"
          --generate-notes
